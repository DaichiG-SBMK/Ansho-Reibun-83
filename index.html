<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>番外編 動名詞 vs 不定詞</title>
<style>
:root{--bg:#f4f6f8;--ink:#1f2937;--muted:#6b7280;--accent:#2c3e50;--ok:#0f766e;--ng:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}header{background:var(--accent);color:white;text-align:center;padding:18px}h1{font-size:clamp(21px,4vw,30px);margin:6px}.wrap{max-width:860px;margin:20px auto;padding:0 12px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 16px}.btn,.choice,.action{border:0;border-radius:10px;cursor:pointer;font:inherit}.btn{background:white;padding:14px;min-height:56px;box-shadow:0 2px 10px #0001}.btn:hover,.choice:hover{background:#e8eef3}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 10px #0001;min-height:160px}.muted{color:var(--muted)}.prompt{font-size:clamp(26px,6vw,42px);font-weight:700;margin:20px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{padding:18px 10px;background:#f4f6f8;border:2px solid #dde5ec;min-height:70px;font-size:18px}.choice:disabled{cursor:default}.correct{border-color:var(--ok);background:#e4f5f0}.incorrect{border-color:var(--ng);background:#fceaea}.answer{font-size:22px;font-weight:700;margin-top:16px}.meaning{font-size:18px;margin:8px 0}.ok{color:var(--ok)}.ng{color:var(--ng)}.action{background:var(--accent);color:white;padding:12px 24px;margin-top:16px}.action:disabled{opacity:.5;cursor:default}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{text-align:left;border-bottom:1px solid #ddd;padding:9px}th{background:#f3f4f6}@media(max-width:550px){.choices{grid-template-columns:1fr}.card{padding:15px}table{font-size:14px}th,td{padding:6px}}
/* 解答後も「次へ」が画面内に収まりやすいコンパクト表示 */
header{padding:9px 12px}h1{margin:2px;font-size:clamp(19px,4vw,26px)}
.wrap{margin:10px auto}.menu{gap:6px;margin:0 0 9px}
.btn{min-height:39px;padding:7px 5px;font-size:14px;border-radius:8px}
.card{padding:12px 16px;min-height:0}.card>p{margin:5px 0}
.prompt{font-size:clamp(25px,6vw,36px);margin:8px 0 5px}
.choices{gap:7px}.choice{min-height:44px;padding:8px 7px;font-size:16px}
.result-label{font-size:18px;margin:10px 0 4px}
.answer-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
.answer{font-size:20px;font-weight:700;margin:0}.meaning{font-size:17px;margin:0}
.action{margin-top:10px;padding:9px 22px;min-height:42px}
@media(max-width:550px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{font-size:15px}.menu{gap:5px}.btn{font-size:13px;min-height:38px}.card{padding:11px}}
</style>
</head>
<body><header><h1>番外編 動名詞 vs 不定詞</h1></header>
<div class="wrap"><nav class="menu" aria-label="出題メニュー"><button class="btn" id="seq">全部順番</button><button class="btn" id="random">全部ランダム</button><button class="btn" id="wrong">誤答ランダム</button><button class="btn" id="stats">学習記録</button><button class="btn" id="reset">記録リセット</button><button class="btn" id="top">トップページ</button></nav><main id="main" class="card" aria-live="polite">問題を読み込んでいます…</main></div>
<script>
(()=>{'use strict';
const CSV_FILE='gerund.csv';
const STORAGE_KEY='GerundVsInfinitive_Extra_v1';
const TOP_URL='https://daichig-sbmk.github.io/Ansho-Reibun-top/';
const main=document.querySelector('#main');let items=[],session=null,stats=readStats();
function readStats(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return data&&typeof data==='object'&&!Array.isArray(data)?data:{}}catch{return {}}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(stats))}catch{alert('学習記録を保存できませんでした。ブラウザの保存設定を確認してください。')}}
function el(tag,content,className){const node=document.createElement(tag);if(content!==undefined)node.textContent=content;if(className)node.className=className;return node}
function clear(){main.replaceChildren()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
// ExcelのCSVをUTF-8でもShift_JISでも読めるようにする。
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"'){quoted=false}else field+=c}else if(c==='"'){quoted=true}else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function load(){try{const response=await fetch(CSV_FILE,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const bytes=await response.arrayBuffer();let content;try{content=new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch{content=new TextDecoder('shift_jis').decode(bytes)}const rows=parseCSV(content.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('問題がありません');items=rows.slice(1).map((r,i)=>({id:String(i+1),verb:(r[0]||'').trim(),form:(r[1]||'').trim(),meaning:(r[2]||'').trim(),type:(r[3]||'normal').trim().toLowerCase(),distractor:(r[4]||'').trim()}));for(const q of items){if(!q.verb||!['doing','to do'].includes(q.form)||!q.meaning||!['normal','meaning'].includes(q.type)||q.type==='meaning'&&(!q.distractor||q.distractor===q.meaning))throw Error('CSVの'+(Number(q.id)+1)+'行目を確認してください')}intro()}catch(error){clear();main.append(el('p','問題を読み込めませんでした。index.html と gerund.csv を同じフォルダに置き、Webページから開いてください。','ng'),el('p',error.message,'muted'))}}
function intro(){session=null;clear();main.append(el('h2','練習を始めましょう'),el('p',`${items.length}問あります。出題方法を選んでください。`,'muted'))}
function start(mode){if(!items.length)return;let selected=mode==='wrong'?items.filter(q=>(stats[q.id]?.wrong||0)>0):items;if(!selected.length){clear();main.append(el('p','まだ間違えた問題はありません。'));return}session={mode,list:mode==='seq'?[...selected]:shuffle(selected),index:0,correct:0};showQuestion()}
function showQuestion(){const s=session;if(!s)return;if(s.index>=s.list.length){clear();main.append(el('h2','終了！'),el('p',`${s.list.length}問中 ${s.correct}問正解`));const back=el('button','メニューに戻る','action');back.onclick=intro;main.append(back);session=null;return}const q=s.list[s.index];clear();main.append(el('p',`${s.mode==='seq'?'全部順番':s.mode==='random'?'全部ランダム':'誤答ランダム'}　${s.index+1} / ${s.list.length}`,'muted'),el('div',q.type==='meaning'?`${q.verb} ${q.form}`:q.verb,'prompt'),el('p',q.type==='meaning'?'意味を選んでください。':'後ろに続く形を選んでください。'));const choices=el('div',undefined,'choices');const correct=q.type==='meaning'?q.meaning:q.form;const options=q.type==='meaning'?[q.meaning,q.distractor]:['doing','to do'];const shuffled=shuffle(options);for(const option of shuffled){const button=el('button',option,'choice');button.type='button';button.onclick=()=>answer(q,option,correct,choices);choices.append(button)}main.append(choices)}
function answer(q,selected,correct,choices){if(choices.dataset.done)return;choices.dataset.done='1';const right=selected===correct;const record=stats[q.id]||{shown:0,correct:0,wrong:0};record.shown++;if(right){record.correct++;session.correct++}else record.wrong++;stats[q.id]=record;save();for(const button of choices.children){button.disabled=true;if(button.textContent===correct)button.classList.add('correct');else if(button.textContent===selected)button.classList.add('incorrect')}const line=el('div',undefined,'answer-line');line.append(el('span',`${q.verb} ${q.form}`,'answer'),el('span',q.meaning,'meaning'));main.append(el('h2',right?'正解！':'不正解',(right?'ok':'ng')+' result-label'),line);const next=el('button',session.index===session.list.length-1?'結果を見る':'次へ','action');next.onclick=()=>{session.index++;showQuestion()};main.append(next)}
function showStats(){session=null;clear();main.append(el('h2','学習記録'));const wrong=items.filter(q=>(stats[q.id]?.wrong||0)>0);if(!wrong.length){main.append(el('p','まだ間違えた問題はありません。'));return}main.append(el('p','このページで間違えた問題の一覧です。正解し直しても記録は残ります。','muted'));const table=el('table');const head=el('tr');for(const h of ['動詞＋形','意味','誤答回数'])head.append(el('th',h));table.append(head);for(const q of wrong){const row=el('tr');for(const v of [`${q.verb} ${q.form}`,q.meaning,String(stats[q.id].wrong)])row.append(el('td',v));table.append(row)}main.append(table)}
document.querySelector('#seq').onclick=()=>start('seq');document.querySelector('#random').onclick=()=>start('random');document.querySelector('#wrong').onclick=()=>start('wrong');document.querySelector('#stats').onclick=showStats;document.querySelector('#reset').onclick=()=>{if(confirm('このページの学習記録をすべて消しますか？')){stats={};save();intro()}};document.querySelector('#top').onclick=()=>{location.href=TOP_URL};load();
})();
</script></body></html>
